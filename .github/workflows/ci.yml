name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUSTUP_TOOLCHAIN: 1.99.0
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Formatting, lint, and release tooling
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install Rust
        run: >-
          rustup toolchain install "$RUSTUP_TOOLCHAIN"
          --profile minimal --component rustfmt --component clippy --no-self-update
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Lint all Rust targets
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test installer and release tooling
        run: |
          sh -n scripts/install.sh
          python3 -m unittest discover -s tests -p 'test_*.py' -v

  test:
    name: Tests (${{ matrix.target }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - x86_64-unknown-linux-musl
    env:
      RUST_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install Rust and target
        run: >-
          rustup toolchain install "$RUSTUP_TOOLCHAIN"
          --profile minimal --target "$RUST_TARGET" --no-self-update
      - name: Run unit and CLI integration tests
        run: cargo test --locked --all-targets --target "$RUST_TARGET"
